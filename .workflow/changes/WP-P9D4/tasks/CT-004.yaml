id: CT-004
title: ItemCode 기반 다중 추첨 Loot Table
goal: |
  UDataAsset 파생 ULB_LootTableDataAsset과 BlueprintType FLB_LootEntry/FLB_LootResult를 Data/Loot에 추가한다. Entry는 FName ItemCode=NAME_None, float Weight=1, int32 MinCount=1, MaxCount=1, Result는 ItemCode/Count를 보유한다.
  DA는 DropChance=0.5, MinRollCount=1, MaxRollCount=3, Entries를 가진다. Min/MaxRollCount의 유효 범위는 0..16이며 역전/범위 밖 값은 전체 추첨 실패다. 추첨 횟수와 Entry별 Stack 수량을 구분한다.
  bool RollLoot(FRandomStream& Random, TArray<FLB_LootResult>& OutResults) const를 제공한다. 출력은 먼저 비우고 유한한 DropChance를 [0,1]로 Clamp해 항아리당 한 번 확률 판정한다. 성공하면 양끝 포함 Min/MaxRollCount에서 횟수를 뽑고 매회 유효 Entry를 가중치 비례로 복원 추출한다. 동일 ItemCode 중복을 허용하고 합산하지 않으며 각 결과의 Count는 해당 Entry Min/MaxCount에서 양끝 포함 선택한다.
  None 코드·비유한/0이하 Weight·MinCount<1·MaxCount<MinCount는 제외한다. 합산은 double이며 비유한 합계나 유효 Entry 없음은 실패다. 선택 경계값은 마지막 유효 Entry로 마무리한다. 수량 난수는 최대 int32 경계에서도 범위 차이/덧셈 overflow가 없게 처리한다.
  0 확률은 반드시 실패, 1 확률은 확률 단계에서 반드시 통과한다. 0회 추첨 결과도 false이며 true는 결과가 1개 이상임을 뜻한다. 전역 RNG·Spawn·MasterItem 조회·DA 변경·재귀 테이블은 추가하지 않는다.
done_when:
  - "추첨 횟수와 항목별 수량이 분리되고 결과 배열은 중복 ItemCode를 허용한다"
  - "확률은 항아리당 한 번 판정하며 유효 설정에서 지정 횟수만큼 복원 추출한다"
  - "확률 0/1·0회·횟수 상한·무효 Entry·수량 overflow 및 출력 초기화가 처리된다"
  - "주입 RandomStream만 사용하며 DA 조회 결과를 런타임 수정하지 않는다"
allow:
  - Source/LB/Data/Loot/LB_LootTableDataAsset.h
  - Source/LB/Data/Loot/LB_LootTableDataAsset.cpp
context:
  - Source/LB/Data/LB_DT_MasterItem.h
verify:
  - name: 에디터 종료 후 LBEditor 빌드
    use: build-editor
  - manual: Diff에서 항아리당 확률 1회·중복 허용 다중 추첨·횟수와 수량 경계 처리를 확인했다
