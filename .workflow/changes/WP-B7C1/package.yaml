id: WP-B7C1
title: BattleComponent 공격 요청 분리
branch: refactor/battle-component
base: master
description: |
  ULB_BattleComponent를 추가하고 플레이어 Normal/Strong 공격 요청의 공통 진입점으로 사용한다.
  PlayerState 소유 ASC와 기존 Ability·Montage·Hitbox·피해·네트워크 권한 구조를 유지한다.
  콤보 상태·입력 버퍼·Combo Data·Montage Section 전환과 공격 GA 상속 변경은 후속 작업이다.
verify:
  - name: 에디터 종료 후 LBEditor 통합 빌드
    use: build-editor
  - manual: 최종 Diff에서 Controller가 공격 ASC·Gameplay Event·공격 태그 활성화를 직접 처리하지 않고 Normal/Strong 요청이 BattleComponent를 통과하는지 확인했다
  - manual: Listen Server + Client 1에서 X 기본 공격의 Montage·서버 명중·피해 복제가 유지되고 Z Strong 요청이 기존 입력 시점에 한 번 전달되는지 확인했다
