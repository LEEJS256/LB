id: CT-006
title: GameState Graph 복제와 두 방 슬롯
goal: |
  LB_DungeonRoomTypes.h에 BlueprintType ELB_DungeonTransitionPhase(Waiting, CountingDown, LoadingNextRoom, FadingOut, FadingIn, Failed)와 FLB_DungeonTransitionSnapshot(CurrentRoomId=None, PendingRoomId=None, ActiveExitId=None, TransitionSerial=0, Phase=Waiting, TotalPlayers=0, NearbyPlayers=0, RequiredPlayers=0, CountdownEndServerTime=0)을 추가한다.
  ALB_GameState에 ReplicatedUsing Route와 TransitionSnapshot, EditDefaultsOnly RoomSlotATransform/RoomSlotBTransform, Transient CurrentRoomLoader/PendingRoomLoader를 추가한다. 서버 전용 bool PublishDungeonRoute(const FLB_DungeonRouteState&), bool UpdateDungeonTransition(const FLB_DungeonTransitionSnapshot&)과 const 조회 API를 제공하고 Route는 InstanceKey가 None일 때 한 번만 게시한다.
  BeginPlay와 OnRep는 같은 로컬 적용 경로를 사용한다. 안정 상태의 CurrentRoomId는 Route에서 정의를 찾아 해당 슬롯에 Current 로더가 없을 때 로드해 늦은 접속을 복구한다. PendingRoomId가 유효하면 Route에서 목적지 방을 찾고 TransitionSerial 홀짝으로 선택한 비현재 슬롯에 비복제 ALB_DungeonRoomLoader를 하나 생성해 로드하며, 성공 시 서버 World 준비 delegate 또는 소유 Client 보고용 로컬 delegate를 한 번 알린다. 같은 RoomId·세대 재적용은 중복 로더를 만들지 않는다.
  서버는 void ReceiveClientRoomReady(ALB_PlayerController* Reporter, FName InstanceKey, FName RoomId, int32 TransitionSerial)로 현재 키·PendingRoomId·세대를 검증한 보고만 네이티브 delegate로 전달한다. 서버 GameMode가 Pending 방의 표시된 ULevel을 조회할 const API를 제공한다. 전환 완료 API는 Pending 로더/RoomId를 Current로 승격하고 ActiveExitId와 PendingRoomId를 초기화하며 이전 Current를 해제한다. EndPlay는 양쪽을 정리한다.
  OnRep/업데이트 때 BlueprintAssignable OnDungeonTransitionChanged를 발행해 UI가 인원·종료 서버 시간을 읽게 한다. GameState는 Exit 목적지 선택·과반수 판정·카운트다운 Timer·Fade·Pawn Teleport를 수행하지 않는다.
done_when:
  - "서버가 한 번 게시한 Graph와 현재 전환 Snapshot이 늦은 Client에도 복제된다"
  - "각 World가 같은 세대·선택 RoomId·두 슬롯 규칙으로 Pending 방을 한 번 로드한다"
  - "Client 준비 보고가 현재 InstanceKey/PendingRoomId/TransitionSerial과 일치할 때만 서버 delegate로 전달된다"
  - "Pending 승격·이전 Current 해제·EndPlay 정리가 로더 수명과 연결된다"
  - "UI delegate는 상태만 알리고 서버 분기/전환 정책을 소유하지 않는다"
allow:
  - Source/LB/Data/Dungeon/LB_DungeonRoomTypes.h
  - Source/LB/GameMode/LB_GameState.h
  - Source/LB/GameMode/LB_GameState.cpp
context:
  - Source/LB/Dungeon/LB_DungeonRoomLoader.h
  - Source/LB/Controller/LB_PlayerController.h
verify:
  - name: 에디터 종료 후 LBEditor 빌드
    use: build-editor
  - manual: Diff에서 Graph/Snapshot 복제·두 슬롯 로더 멱등성·RoomId 준비 보고·승격/정리를 확인했다
