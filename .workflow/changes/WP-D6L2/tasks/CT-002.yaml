id: CT-002
title: 연속 조립 데이터의 순서형 Room Route 전환
goal: |
  Data/Dungeon의 LB_DungeonRoomTypes.h에 BlueprintType FLB_DungeonRoomDefinition(RoomId, TSoftObjectPtr<UWorld> Level)과 FLB_DungeonRouteState(InstanceKey, TArray Rooms)를 정의한다. 완료된 CT-001의 LB_DungeonAssemblyTypes.h는 제거하고 참조를 새 타입으로 교체하되 과거 Commit 자체를 되돌리지 않는다.
  FLB_DungeonRouteState::bool Validate(FString& OutError) const는 InstanceKey·방 목록을 검사한다. 키/RoomId는 영문숫자/underscore만, RoomId는 None/중복 금지, Rooms는 1..32개, Level은 null 금지다. 같은 맵을 다른 RoomId로 반복 사용하는 것은 허용한다.
  ULB_DungeonLayoutDataAsset은 TArray Rooms만 보유하도록 바꾸고 bool ValidateLayout(FString& OutError) const와 bool BuildRoute(FName InstanceKey, FLB_DungeonRouteState& OutRoute, FString& OutError) const를 제공한다. 출력은 먼저 기본값으로 초기화하고 성공 시 원본 목록을 값 복사하며 Data Asset 참조나 작성용 Transform을 Route에 넣지 않는다.
  기존 FLB_DungeonPiecePlacement/FLB_DungeonAssemblyState/BuildAssembly/Pieces/작성용 Transform 계약을 남기지 않는다. 랜덤 선택·Seed·현재 방 인덱스·슬롯 Transform·연결 포트는 만들지 않는다.
done_when:
  - "완료된 CT-001 위에서 Piece/Transform 계약이 Room Route 계약으로 교체된다"
  - "RoomId·1..32개·Soft 맵 참조 검증을 Layout과 Route가 공유한다"
  - "BuildRoute 실패는 출력을 초기화하고 성공은 Data Asset을 수정하지 않는 독립 복사본을 만든다"
  - "기존 Assembly 타입·API·헤더 참조가 남지 않는다"
allow:
  - Source/LB/Data/Dungeon/LB_DungeonAssemblyTypes.h
  - Source/LB/Data/Dungeon/LB_DungeonRoomTypes.h
  - Source/LB/Data/Dungeon/LB_DungeonLayoutDataAsset.h
  - Source/LB/Data/Dungeon/LB_DungeonLayoutDataAsset.cpp
context:
  - Source/LB/Data/LB_PlayerDataAsset.h
verify:
  - name: 에디터 종료 후 LBEditor 빌드
    use: build-editor
  - manual: Diff에서 기존 Piece/Transform 제거·Room Route 분리·1..32개 검증·독립 목록 복사를 확인했다
