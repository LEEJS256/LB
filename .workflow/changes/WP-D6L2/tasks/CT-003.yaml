id: CT-003
title: 순서형 Route의 Room Exit Graph 확장
goal: |
  CT-002의 LB_DungeonRoomTypes.h에 BlueprintType FLB_DungeonExitLink(ExitId, TargetRoomId)를 추가하고 FLB_DungeonRoomDefinition에 TArray Exits, FLB_DungeonRouteState와 ULB_DungeonLayoutDataAsset에 StartRoomId를 추가한다.
  기존 InstanceKey·RoomId·1..32개·Level 검증을 유지한다. 모든 ID는 영문숫자/underscore만 허용하고 StartRoomId는 존재해야 한다. 방별 Exit는 0..4개이며 ExitId는 해당 방에서 None/중복 금지, TargetRoomId는 존재하는 다른 방이어야 한다.
  StartRoomId에서 모든 방이 도달 가능해야 하고 방향 Cycle·Self Link는 거부한다. 분기 후 다시 합쳐지는 DAG와 같은 맵을 다른 RoomId로 사용하는 것은 허용하며 종료 방은 Exits가 비어 있다.
  ValidateLayout/BuildRoute는 StartRoomId와 Exit Graph를 함께 검사·값 복사한다. 실패 시 OutRoute를 기본값으로 유지하고 Data Asset을 수정하지 않는다. 랜덤 선택·Seed·현재 방·슬롯 Transform·되돌아가기는 만들지 않는다.
done_when:
  - "CT-002 순서 목록이 StartRoom/Room/Exit Graph로 확장되고 기존 Room 검증을 보존한다"
  - "방별 0..4 Exit·고유 ID·목적지 참조를 검증한다"
  - "도달 불가·Self Link·Cycle은 거부하고 분기 후 합류하는 DAG는 허용한다"
  - "BuildRoute가 실패 출력을 초기화하고 성공 시 독립 Graph 복사본을 만든다"
allow:
  - Source/LB/Data/Dungeon/LB_DungeonRoomTypes.h
  - Source/LB/Data/Dungeon/LB_DungeonLayoutDataAsset.h
  - Source/LB/Data/Dungeon/LB_DungeonLayoutDataAsset.cpp
context:
  - Source/LB/Data/Dungeon/LB_DungeonRoomTypes.h
verify:
  - name: 에디터 종료 후 LBEditor 빌드
    use: build-editor
  - manual: Diff에서 StartRoom/Exit Graph·도달성/Cycle 검증·기존 Route 호환을 확인했다
