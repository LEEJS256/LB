id: CT-003
title: 단일 방 로더 수명
goal: |
  AActor 파생 ALB_DungeonRoomLoader를 Dungeon에 추가한다. bReplicates=false·Tick 비활성으로 두고 bool LoadRoomLocal(FName InstanceKey, int32 RoomIndex, const FLB_DungeonRoomDefinition& Room, const FTransform& SlotTransform), void UnloadRoomLocal()을 제공한다.
  입력 Route 키·인덱스·Room을 검증한 뒤 ULevelStreamingDynamic::LoadLevelInstanceBySoftObjectPtr의 Transform 오버로드로 한 방만 로드한다. 이름 Override는 LB_<InstanceKey>_<RoomIndex>_<RoomId>로 만들고 서버와 Client가 같은 입력에서 같은 이름을 사용한다. 로더 Actor Transform은 합성하지 않는다.
  OnLevelShown과 현재 상태로 표시 완료를 집계해 BlueprintAssignable OnRoomReady를 한 번 발행하고 표시된 ULevel을 읽는 const 조회 API를 제공한다. 초기 호출 실패 또는 타이머 기반 LoadTimeoutSeconds(기본 30초) 초과 시 OnRoomFailed를 한 번 발행하고 해당 Streaming 객체·delegate·timer를 정리한다.
  동일 요청 재호출은 중복 로드하지 않고 기존 수락 결과를 반환하며 다른 방 요청은 거부한다. UnloadRoomLocal/EndPlay는 ShouldBeVisible/ShouldBeLoaded=false와 SetIsRequestingUnloadAndRemoval(true)로 해제를 요청하고 해제 중 재사용하지 않는다. Route 선택·두 슬롯 관리·Fade·Pawn 이동·FlushLevelStreaming은 추가하지 않는다.
done_when:
  - "한 로더가 명시적 이름과 슬롯 Transform으로 한 방만 비동기 로드한다"
  - "요청 수락과 표시 완료를 구분하고 Ready/Failed를 종료 경로별 한 번만 발행한다"
  - "동일 요청은 멱등하고 다른 요청·해제 중 재사용은 거부한다"
  - "실패·Timeout·EndPlay가 Streaming·delegate·timer를 정리한다"
allow:
  - Source/LB/Dungeon/LB_DungeonRoomLoader.h
  - Source/LB/Dungeon/LB_DungeonRoomLoader.cpp
context:
  - Source/LB/Data/Dungeon/LB_DungeonRoomTypes.h
verify:
  - name: 에디터 종료 후 LBEditor 빌드
    use: build-editor
  - manual: Diff에서 단일 방 수명·표시 완료·실패 정리·동일 요청 중복 방지를 확인했다
