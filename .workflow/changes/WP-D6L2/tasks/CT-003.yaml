id: CT-003
title: GameState 확정 배치 복제와 로컬 조립
goal: |
  ALB_GameState에 ReplicatedUsing=OnRep_DungeonAssembly FLB_DungeonAssemblyState DungeonAssembly와 bool PublishDungeonAssembly(const FLB_DungeonAssemblyState& NewState)를 추가한다. Publish는 서버·State 유효성·기존 InstanceKey None을 검사하고 단 한 번 복사 게시한 뒤 ForceNetUpdate와 로컬 적용을 수행한다.
  GetLifetimeReplicatedProps로 State를 복제한다. Layout DA 참조·Seed·조립기 Actor 포인터는 복제하지 않는다. 서버가 확정한 Pieces와 InstanceKey를 현재 상태로 유지해 늦은 접속에도 전달한다.
  BeginPlay와 OnRep는 같은 ApplyDungeonAssembly()를 호출한다. BeginPlay 전에는 수신 State만 보유하고 BeginPlay에서 재적용한다. 초기 None 키는 미게시 상태로 대기하며 실패를 알리지 않는다.
  각 World의 GameState는 UPROPERTY Transient로 보유하는 bReplicates=false ALB_DungeonAssembler를 World Persistent Level에 Identity Transform으로 한 번 생성하고 AssembleLocal(State)를 호출한다. 같은 상태 재적용은 기존 로컬 조립기를 사용한다.
  명시적 Unload나 Helper Destroy 후 같은 World에서 재조립하지 않는다. GameState EndPlay에서 Helper를 정리하고 수동 배치 조립기와 중복 생성하지 않는다. 로컬 Ready/Failed를 전원 준비 완료로 취급하지 않는다. Player RPC·입장 허용·런타임 State 교체는 추가하지 않는다.
done_when:
  - "서버만 한 번 게시한 확정 목록이 GameState 현재 상태로 복제된다"
  - "OnRep/BeginPlay 순서와 재적용이 조립기 중복 생성을 일으키지 않는다"
  - "각 World의 비복제 로컬 조립기와 EndPlay 정리가 연결된다"
  - "Layout 독자 해석·Multicast 전용 전달·전원 준비 상태를 추가하지 않는다"
allow:
  - Source/LB/GameMode/LB_GameState.h
  - Source/LB/GameMode/LB_GameState.cpp
context:
  - Source/LB/Data/Dungeon/LB_DungeonAssemblyTypes.h
  - Source/LB/Dungeon/LB_DungeonAssembler.h
verify:
  - name: 에디터 종료 후 LBEditor 빌드
    use: build-editor
  - manual: Diff에서 GameState 단일 게시·늦은 접속 경로·로컬 helper 수명을 확인했다
