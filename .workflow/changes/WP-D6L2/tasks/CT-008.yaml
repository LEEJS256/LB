id: CT-008
title: GameMode Graph 게시와 준비 Barrier
goal: |
  ALB_GameMode에 EditDefaultsOnly ULB_DungeonLayoutDataAsset* StartupDungeonLayout, RoomReadyTimeoutSeconds(기본 30초)를 추가하고 StartPlay()에서 서버 ALB_GameState를 조회한다. Layout이 유효하면 GUID Digits InstanceKey로 BuildRoute하고 Graph를 한 번 게시한 뒤 PendingRoomId=StartRoomId, ActiveExitId=None, TransitionSerial=1, Phase=LoadingNextRoom Snapshot을 게시한다.
  GameState의 서버 World 준비와 검증된 Client 준비 delegate를 구독한다. 전환 시작 시 유효 PlayerState·Pawn을 가진 비관전자 PlayerController 집합을 Barrier 참가자로 캡처하고, 같은 InstanceKey/PendingRoomId/TransitionSerial의 서버 World와 모든 참가 Controller 보고가 모였을 때만 HandleRoomBarrierReady() 내부 경로를 한 번 실행한다.
  준비 보고는 Controller별 중복을 무시하고 참가자가 아닌 Controller·오래된 세대·PendingRoomId와 다른 방 보고를 거부한다. Logout은 잠긴 Barrier 참가자에서 제거하고 Timeout 또는 로컬 로드 실패는 Snapshot을 Failed로 바꾸되 Fade·Teleport·자동 재시도를 실행하지 않는다.
  PostLogin으로 전환 중 들어온 Controller는 현재 Barrier에 추가하지 않는다. 안정된 Current 방은 이후 GameState 복제로 로드하게 하며 랜덤 Graph·세션·로비·방 클리어는 추가하지 않는다.
done_when:
  - "서버가 고정 Graph를 한 번 게시하고 StartRoomId 로드를 같은 Snapshot 계약으로 시작한다"
  - "서버 World와 전환 시작 시 참가 Client 전부의 현재 RoomId/세대 보고만 Barrier를 완료한다"
  - "중복/오래된/비참가 보고와 중간 접속은 현재 Barrier를 잘못 완료시키지 않는다"
  - "Logout·Timeout·로드 실패가 Barrier와 Timer를 정리하고 실패 상태를 남긴다"
allow:
  - Source/LB/GameMode/LB_GameMode.h
  - Source/LB/GameMode/LB_GameMode.cpp
context:
  - Source/LB/Data/Dungeon/LB_DungeonLayoutDataAsset.h
  - Source/LB/GameMode/LB_GameState.h
verify:
  - name: 에디터 종료 후 LBEditor 빌드
    use: build-editor
  - manual: Diff에서 단일 Graph 게시·StartRoom 요청·참가자 Snapshot·준비 Barrier·Timeout 정리를 확인했다
