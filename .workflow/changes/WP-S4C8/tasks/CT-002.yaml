id: CT-002
title: "AIController의 타깃 소유와 조회 계약"
goal: |
  ALB_MonsterAIController에 Transient TWeakObjectPtr<AActor> TargetActor와 BlueprintPure AActor* GetCombatTarget() const, 서버용 void SetCombatTarget(AActor* NewTarget)를 추가한다.
  Target은 Controller만 소유하고 플레이어/MonsterData/몬스터 Character에 복사하지 않는다. null은 해제이며 비Authority·자기 자신은 설정하지 않는다.
  GetCombatTarget은 weak 포인터 유효성을 확인해 반환하고 OnUnPossess에서 해제한다. 탐색이나 Tick은 추가하지 않는다.
done_when:
  - "타깃의 weak 소유와 지정/조회 API가 Controller 안에만 있다"
  - "서버 설정과 null 해제·UnPossess 정리가 있으며 무효 포인터를 반환하지 않는다"
  - "기존 Logic 시작 수명을 유지하고 allow 두 파일만 변경된다"
allow:
  - "Source/LB/Controller/LB_MonsterAIController.h"
  - "Source/LB/Controller/LB_MonsterAIController.cpp"
context:
  - "Source/LB/Controller/LB_MonsterAIController.h"
  - "Source/LB/Character/Monster/LB_MonsterBase.h"
verify:
  - name: 에디터 종료 후 LBEditor 빌드
    use: build-editor
  - manual: "Diff에서 Target 소유·권한·해제 계약을 확인했다"
