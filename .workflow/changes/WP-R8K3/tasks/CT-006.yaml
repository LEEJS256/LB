id: CT-006
title: GameMode 방 상태 수명과 Exit 잠금 연결
goal: |
  ALB_GameMode가 서버에서 ALB_DungeonRoomRuntimeManager 하나를 소유·정리한다. WP-D6L2의 Current 방 승격 뒤 GameState가 제공하는 표시 ULevel과 CurrentRoomId로 ActivateRoom을 호출하고, 기존 Current 방을 해제하기 전 DeactivateRoom을 호출한다. 초기 StartRoom과 이후 같은 RoomId 재활성화가 같은 경로를 사용한다.
  활성 방의 ALB_DungeonExit 집합을 구독하기 전에 Runtime Manager Spawn이 성공해야 한다. HasLivingMonsters가 true면 모든 Exit를 비활성화하고, OnRoomCombatStateChanged에서 0명이 되는 순간 활성화한 뒤 기존 Exit별 과반수 평가를 다시 수행한다. 전환 잠금 뒤에는 상태 변화가 목적지·Barrier를 바꾸지 않으며 종료 방의 빈 Exit 집합도 허용한다.
  Runtime 활성화/Marker 검증/Spawn 실패는 Dungeon Transition을 Failed로 남기고 Exit를 열거나 Fade·Teleport하지 않는다. EndPlay와 실패 정리는 Runtime Manager·Exit delegate·Actor를 정리하되 누적 Room 상태는 던전 세션이 끝날 때만 폐기한다.
  Graph Cycle/되돌아가기 링크·DropItem 보존·방 클리어 UI는 추가하지 않는다.
done_when:
  - "Start와 이후 방 승격이 동일한 서버 Runtime 활성화 경로를 사용하고 이전 방 해제 전에 관리 Actor를 정리한다"
  - "생존 몬스터가 있으면 모든 Exit가 잠기고 마지막 사망 뒤에만 열려 기존 Exit별 과반수 평가가 재개된다"
  - "Runtime 실패는 전환 실패로 남고 빈 방 이동이나 열린 Exit를 만들지 않는다"
  - "같은 RoomId가 다시 활성화되면 Manager의 기존 사망/파괴 상태로 Spawn을 필터링한다"
  - "GameMode 종료 시 delegate·Runtime Actor를 정리하고 기존 Barrier/Fade/파티 이동 권한을 유지한다"
allow:
  - Source/LB/GameMode/LB_GameMode.h
  - Source/LB/GameMode/LB_GameMode.cpp
context:
  - Source/LB/GameMode/LB_GameState.h
  - Source/LB/Dungeon/LB_DungeonRoomRuntimeManager.h
  - Source/LB/Dungeon/LB_DungeonRoomMarkers.h
verify:
  - name: 에디터 종료 후 LBEditor 빌드
    use: build-editor
  - manual: Diff에서 방 승격/해제 수명·몬스터 수 기반 Exit 잠금·실패/종료 정리와 기존 전환 보존을 확인했다
