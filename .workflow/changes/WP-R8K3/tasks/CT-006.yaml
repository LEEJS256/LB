id: CT-006
title: GameMode 방 상태 수명과 Exit 잠금 연결
goal: |
  ALB_GameMode가 StartDungeon의 Route 게시 성공 뒤 서버 전용 ALB_DungeonRoomRuntimeManager 하나를 생성해 현재 InstanceKey 세션 동안 소유·정리한다. Fade Out 완료 시 기존 Current Runtime을 먼저 Deactivate하고, GameState의 PendingRoomId와 표시된 Pending ULevel로 새 Runtime을 Activate한 뒤에만 파티 Teleport와 CompleteDungeonTransition을 수행한다. CompleteDungeonTransition 내부에서 이전 Current Loader가 즉시 해제되는 현재 순서를 전제로 하며 초기 StartRoom과 이후 같은 RoomId 재방문이 같은 경로를 사용한다.
  새 Runtime 활성화가 성공하면 Pending 방 Exit 집합에 HasLivingMonsters를 반영한다. 생존 몬스터가 있으면 모든 Exit를 비활성화하고, 승격·Fade In 뒤 기존 Current Exit 구독 경로를 사용한다. OnRoomCombatStateChanged에서 0명이 되는 순간 Exit를 활성화해 이미 영역 안에 있는 Pawn을 복구한 뒤 기존 Exit별 과반수 평가를 다시 수행한다. 전환 잠금 뒤에는 상태 변화가 목적지·Barrier를 바꾸지 않으며 Marker/Exit가 없는 빈 방도 허용한다.
  Runtime 활성화/Marker 검증/Spawn 실패는 Teleport와 승격 전에 Pending Runtime을 정리하고 Fade 화면을 복구한 뒤 Dungeon Transition을 Failed로 남긴다. 승격 실패도 활성화한 Runtime을 Deactivate한다. EndPlay와 실패 정리는 Runtime Manager·Exit delegate·Actor를 정리하되 누적 Room 상태는 던전 세션이 끝날 때만 폐기한다.
  기존 Graph Cycle·TargetEntryId·Current/Pending Entry·Pawn별 도착 Exit 억제를 보존한다. Graph 생성 규칙 변경·DropItem 보존·방 클리어 UI·Host Migration은 추가하지 않는다.
done_when:
  - "Start와 이후 방 승격이 동일한 서버 Runtime 활성화 경로를 사용하고 이전 방 해제 전에 관리 Actor를 정리한다"
  - "생존 몬스터가 있으면 모든 Exit가 잠기고 마지막 사망 뒤에만 열려 기존 Exit별 과반수 평가가 재개된다"
  - "Runtime 실패는 전환 실패로 남고 빈 방 이동이나 열린 Exit를 만들지 않는다"
  - "실제 순환 링크로 같은 RoomId가 다시 활성화되면 Manager의 기존 사망/파괴 상태로 Spawn을 필터링하고 TargetEntryId 도착 억제를 유지한다"
  - "GameMode 종료 시 delegate·Runtime Actor를 정리하고 기존 Barrier/Fade/파티 이동 권한을 유지한다"
allow:
  - Source/LB/GameMode/LB_GameMode.h
  - Source/LB/GameMode/LB_GameMode.cpp
context:
  - Source/LB/GameMode/LB_GameState.h
  - Source/LB/GameMode/LB_GameState.cpp
  - Source/LB/Dungeon/LB_DungeonRoomRuntimeManager.h
  - Source/LB/Dungeon/LB_DungeonRoomMarkers.h
verify:
  - name: 에디터 종료 후 LBEditor 빌드
    use: build-editor
  - manual: Diff에서 방 승격/해제 수명·몬스터 수 기반 Exit 잠금·실패/종료 정리와 기존 전환 보존을 확인했다
