id: CT-003
title: 방 게임플레이 Spawn Marker
goal: |
  Dungeon의 LB_DungeonGameplayMarkers.h/.cpp에 비복제·Tick 비활성 AActor 기반 ALB_DungeonGameplaySpawnMarker와 파생 ALB_DungeonMonsterSpawnMarker, ALB_DungeonPropSpawnMarker를 추가한다. Base는 EditInstanceOnly FName SpawnId와 SceneComponent Root를 가지며 SpawnId가 None이 아니고 영문숫자/underscore인지 검사하는 API를 제공한다.
  Monster Marker는 EditInstanceOnly TSubclassOf<ALB_MonsterBase> MonsterClass, Prop Marker는 EditInstanceOnly TSubclassOf<ALB_DestructibleProp> PropClass를 보유하고 서버 Runtime Manager가 Marker Transform과 소유 ULevel에 Actor를 생성할 수 있게 const 조회 API만 제공한다.
  Marker는 BeginPlay Spawn·복제·Actor 상태·RoomId·Loot·Exit 제어를 수행하지 않는다. 같은 방의 모든 Monster/Prop Marker는 종류와 무관하게 SpawnId 하나의 고유 집합을 사용한다.
done_when:
  - "방 에셋이 몬스터와 Prop의 안정 SpawnId·Class·Transform을 Marker로 작성할 수 있다"
  - "Marker 종류와 무관한 방 단위 SpawnId 고유 계약과 ID 검증이 정의된다"
  - "Marker가 자동 Spawn·복제·방 상태·Exit 정책을 소유하지 않는다"
allow:
  - Source/LB/Dungeon/LB_DungeonGameplayMarkers.h
  - Source/LB/Dungeon/LB_DungeonGameplayMarkers.cpp
context:
  - Source/LB/Character/Monster/LB_MonsterBase.h
  - Source/LB/Object/Destructible/LB_DestructibleProp.h
verify:
  - name: 에디터 종료 후 LBEditor 빌드
    use: build-editor
  - manual: Diff에서 Marker 책임·SpawnId 검증·Class/Transform 조회와 Tick/복제 비활성을 확인했다
