id: CT-004
title: 서버 방 상태 저장과 Actor 복구
goal: |
  Data/Dungeon의 LB_DungeonRoomRuntimeTypes.h에 BlueprintType FLB_DungeonRoomRuntimeState(RoomId, DefeatedMonsterIds, BrokenPropIds)를 정의하고 소비 ID 조회·기록 API를 제공한다. Dungeon의 비복제·Tick 비활성 ALB_DungeonRoomRuntimeManager는 서버 전용 ActivateRoom(FName RoomId, ULevel* LoadedLevel), DeactivateRoom(), HasLivingMonsters(), GetRoomState()와 네이티브 OnRoomCombatStateChanged delegate를 제공한다.
  ActivateRoom은 표시된 ULevel의 Monster/Prop Marker만 모아 종류와 무관한 SpawnId 유효성·중복·Class를 전부 검증한 뒤 생성한다. Marker가 0개인 방도 유효하며 생존 몬스터가 없는 빈 Runtime으로 활성화한다. 현재 InstanceKey 세션의 TMap<FName, FLB_DungeonRoomRuntimeState>는 Deactivate 뒤에도 유지하며, DefeatedMonsterIds/BrokenPropIds에 있는 Marker는 건너뛴다. Spawn은 서버에서 Marker Transform과 FActorSpawnParameters::OverrideLevel, AlwaysSpawn을 사용하고 생성 Actor의 사망/파괴 delegate를 SpawnId와 연결한다.
  Actor Spawn은 방 단위 원자성을 가진다. 검증 뒤 실제 Spawn이나 delegate 연결이 하나라도 실패하면 이번 ActivateRoom 시도에서 만든 Actor를 모두 제거하고 delegate·현재 활성 방 참조를 정리한 뒤 false를 반환한다. 실패한 시도는 사망/파괴 ID를 추가하거나 기존 누적 Room 상태를 지우지 않는다.
  몬스터 사망 신호는 ID를 먼저 기록하고 살아 있는 몬스터 집합에서 제거한 뒤 전투 상태 변경을 알린다. Prop 파괴 신호는 ID를 먼저 기록한다. DeactivateRoom은 delegate를 해제하고 아직 유효한 관리 Actor를 제거하되 소비되지 않은 ID를 기록하지 않는다. 같은 RoomId 재활성화에서 죽은 몬스터와 깨진 Prop은 생성하지 않고, 생존 몬스터·온전한 Prop은 다시 생성한다.
  상태는 서버 메모리 전용이며 Client 복제·디스크 SaveGame·현재 체력/AI 위치·미획득 DropItem을 저장하지 않는다. RoomId는 Route에 생성된 방 노드의 고유 ID이며 같은 Level을 사용한 다른 RoomId와 상태를 공유하지 않는다. 검증 실패는 부분 Spawn 없이 실패하고 RoomId가 바뀐 동시 활성화는 거부한다.
done_when:
  - "서버 세션의 RoomId별 사망/파괴 ID가 방 비활성화 뒤에도 유지되고 같은 방 재활성화 Spawn을 필터링한다"
  - "Marker 전체 검증 뒤 소유 Streaming ULevel에만 Actor를 Spawn하고 결과 delegate를 ID에 연결한다"
  - "Spawn 또는 delegate 연결 실패는 이번 시도의 Actor와 구독을 전부 롤백하고 누적 Room 상태를 변경하지 않는다"
  - "사망/파괴 결과는 Actor 외부 호출보다 먼저 멱등 기록되고 살아 있는 몬스터 수 변경이 통지된다"
  - "Deactivate/EndPlay가 구독과 Actor를 정리하되 생존·미파괴 대상을 소비 처리하지 않는다"
  - "Marker가 없는 방은 빈 Runtime으로 성공하고 같은 Level의 서로 다른 RoomId 상태는 분리된다"
  - "Client 상태 복제·SaveGame·중간 상태·DropItem 보존을 추가하지 않는다"
allow:
  - Source/LB/Data/Dungeon/LB_DungeonRoomRuntimeTypes.h
  - Source/LB/Dungeon/LB_DungeonRoomRuntimeManager.h
  - Source/LB/Dungeon/LB_DungeonRoomRuntimeManager.cpp
context:
  - Source/LB/Dungeon/LB_DungeonGameplayMarkers.h
  - Source/LB/Character/Monster/LB_MonsterBase.h
  - Source/LB/Object/Destructible/LB_DestructibleProp.h
verify:
  - name: 에디터 종료 후 LBEditor 빌드
    use: build-editor
  - manual: Diff에서 전검증 후 원자적 Spawn/롤백·OverrideLevel·RoomId별 소비 집합·재활성화 필터·정리를 확인했다
