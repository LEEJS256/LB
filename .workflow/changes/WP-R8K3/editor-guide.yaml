steps:
  - id: E01
    after: CT-003
    title: Room A 게임플레이 Spawn Marker 배치
    items:
      - action: /Game/LB/Tests/Dungeon/Maps/Lvl_DungeonRoom_A에서 직접 배치한 몬스터·항아리와 Level Blueprint Spawn이 없는지 확인하고 Monster Spawn Marker 2개와 Prop Spawn Marker 2개를 서로 겹치지 않게 배치한다.
        expected: 네 Marker의 SpawnId가 종류와 무관하게 모두 고유하고 영문숫자/underscore이며 각 Class와 Transform이 유효하다.
        restart_editor: true
      - action: Monster Marker에는 기존 테스트 가능한 ALB_MonsterBase 파생 BP를, Prop Marker에는 /Game/LB/Tests/Destructible/BP_DestructiblePot을 연결한다.
        expected: Marker만 저장되며 PIE 전 방 맵에 런타임 몬스터·Prop Actor가 직접 존재하지 않는다.
  - id: E02
    after: CT-004
    title: 서버 Spawn과 같은 RoomId 수동 재활성화
    items:
      - action: 서버에서 Room_A Runtime을 활성화하고 생성 Actor 수·소유 Level·SpawnId 연결을 확인한다. 중복 SpawnId, None ID, 무효 Class도 각각 시험한다.
        expected: 유효 설정은 Marker당 Actor 하나를 표시된 Room_A ULevel에 생성하고 무효 설정은 부분 Spawn 없이 실패한다.
        restart_editor: true
      - action: 몬스터 하나를 죽이고 Prop 하나를 파괴한 뒤 Room_A Runtime을 비활성화하고 같은 RoomId로 다시 활성화한다.
        expected: 소비된 두 Actor는 다시 생성되지 않고 생존했던 몬스터와 온전했던 Prop만 초기 상태로 다시 생성되며 Prop Loot가 재추첨되지 않는다.
  - id: E99
    before: PR
    title: 몬스터 Exit 잠금과 방 상태 네트워크 최종 확인
    items:
      - target: /Game/LB/Tests/Dungeon/Maps/Lvl_DungeonTransitionTest
        action: Listen Server와 Client 1로 Room_A에 진입해 몬스터가 살아 있는 동안 두 Exit에 각각 들어간다.
        expected: 양쪽 Exit가 서버에서 비활성이고 Presence·카운트다운·전환이 시작되지 않으며 몬스터와 Prop은 서버 Spawn 결과가 Client에 하나씩 복제된다.
        restart_editor: true
      - action: 몬스터를 한 마리씩 처치하고 마지막 사망 전후 Exit 상태를 확인한다.
        expected: 마지막 몬스터 전에는 Exit가 잠겨 있고 마지막 사망 결과 기록 뒤 두 Exit가 열리며 기존 Exit별 과반수 규칙이 다시 동작한다.
      - action: Prop 하나를 파괴하고 Loot를 줍지 않은 채 같은 RoomId 재활성화 테스트를 수행한다.
        expected: 죽은 몬스터와 깨진 Prop은 양쪽 World에서 되살아나지 않고 Loot도 다시 추첨되지 않는다. 미획득 DropItem은 사라지며 온전한 Prop만 다시 생성된다.
      - action: Client 퇴장, 로드 실패, PIE 종료와 Runtime Manager EndPlay를 시험한다.
        expected: Exit·몬스터·Prop delegate와 관리 Actor가 정리되고 오래된 사망/파괴 신호가 다음 방 상태를 변경하지 않는다.
